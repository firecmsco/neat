name: Deploy to Firebase Hosting on PR
'on': pull_request
jobs:
  build_and_preview:
    if: '${{ github.event.pull_request.head.repo.full_name == github.repository }}'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The repo declares pnpm via "packageManager"; corepack honours it.
      - run: corepack enable
      # The editor's `build` ends in `build:seo`, which renders the static pages
      # with the published bundle, lib/dist/index.umd.js, so lib is installed and
      # built first. Without it every deploy since 2026-08-26 failed at that step
      # and published nothing.
      - run: pnpm install --frozen-lockfile
        working-directory: lib
      - run: pnpm build
        working-directory: lib
      # editor/ is installed on its own: vite aliases @firecms/neat straight to
      # lib/src, so the app bundle itself does not read lib/dist.
      - run: pnpm install --frozen-lockfile
        working-directory: editor
      - run: pnpm build
        working-directory: editor
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_NEAT_CO }}'
          projectId: neat-co
          entryPoint: "./editor"
