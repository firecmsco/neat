# https://github.com/firebase/firebase-tools

name: Deploy to Firebase Hosting on merge
'on':
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The repo declares pnpm via "packageManager"; corepack honours it.
      - run: corepack enable
      # editor/ is installed on its own: vite aliases @firecms/neat straight to
      # lib/src, so the library needs no install or build of its own.
      - run: pnpm install --frozen-lockfile
        working-directory: editor
      - run: pnpm build
        working-directory: editor
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_NEAT_CO }}'
          channelId: live
          projectId: neat-co
          entryPoint: "./editor"
